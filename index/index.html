<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>מיומנה של ג'וניורית</title>
  <style>
    :root {
      --primary: #1e3a8a;
      --bg: #f8fafc;
      --card-bg: #ffffff;
      --text: #1e293b;
      --muted: #64748b;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background-color: var(--bg);
      color: var(--text);
      line-height: 1.6;
      padding: 20px;
    }
    .container { max-width: 800px; margin: 0 auto; }
    header {
      text-align: center;
      padding: 40px 20px;
      background: var(--card-bg);
      border-radius: 12px;
      box-shadow: 0 4px 6px -1px rgba(0,0,0,0.05);
      margin-bottom: 30px;
    }
    header img {
      max-width: 140px;
      height: auto;
      border-radius: 50%;
      margin-bottom: 15px;
    }
    h1 { color: var(--primary); margin-bottom: 10px; font-size: 2rem; }
    p.lead { color: var(--muted); font-size: 1.1rem; }
    .post-card {
      background: var(--card-bg);
      border-radius: 12px;
      padding: 24px;
      margin-bottom: 24px;
      box-shadow: 0 4px 6px -1px rgba(0,0,0,0.05);
    }
    .post-card h2 { color: var(--primary); margin-bottom: 12px; }
    .video-wrapper {
      position: relative;
      padding-bottom: 56.25%;
      height: 0;
      margin: 15px 0;
    }
    .video-wrapper iframe {
      position: absolute;
      top: 0; left: 0; width: 100%; height: 100%;
      border-radius: 8px;
    }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <img src="logo.png" alt="לוגו מיומנה של ג'וניורית">
      <h1>מיומנה של ג'וניורית</h1>
      <p class="lead">הבלוג לתמיכה וליווי ג'וניוריות בעולמות הסייבר</p>
    </header>

    <main>
      <article class="post-card">
        <h2>ברוכות הבאות לקהילה!</h2>
        <p>כאן יעלו מאמרים, מדריכים וכלים שיעזרו לכן לעשות את הצעדים הראשונים בעולם הסייבר.</p>
      </article>
    </main>
  </div>
</body>
</html>
