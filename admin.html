<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>מערכת ניהול תוכן | מיומנה של ג'וניורית</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Assistant:wght@300;400;600;700;800&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
  
  <link rel="stylesheet" href="css/style.css">
  <style>
    .admin-login-box {
      max-width: 420px;
      margin: 80px auto;
      background: var(--bg-surface);
      border: 1px solid var(--border-color);
      border-radius: 20px;
      padding: 36px 28px;
      text-align: center;
      box-shadow: 0 12px 30px rgba(0,0,0,0.5);
    }

    .form-group {
      margin-bottom: 16px;
      text-align: right;
    }

    .form-group label {
      display: block;
      font-size: 0.85rem;
      font-weight: 700;
      color: var(--accent);
      margin-bottom: 6px;
    }

    .form-control {
      width: 100%;
      background: var(--bg-base);
      border: 1px solid var(--border-color);
      color: var(--text-main);
      padding: 10px 14px;
      border-radius: 10px;
      font-family: 'Assistant', sans-serif;
      font-size: 0.95rem;
    }

    .form-control:focus {
      outline: none;
      border-color: var(--accent);
      box-shadow: 0 0 10px var(--accent-muted);
    }

    textarea.form-control {
      resize: vertical;
      min-height: 80px;
    }

    .admin-panel {
      display: none;
      padding: 30px 0 60px;
    }

    .admin-card {
      background: var(--bg-surface);
      border: 1px solid var(--border-color);
      border-radius: 20px;
      padding: 28px;
      margin-bottom: 24px;
    }

    .admin-card h3 {
      font-size: 1.3rem;
      color: var(--accent);
      margin-bottom: 18px;
      border-bottom: 1px solid var(--border-color);
      padding-bottom: 10px;
    }

    .grid-2 {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 16px;
    }

    .btn-admin {
      background: var(--primary);
      color: #fff;
      border: 1px solid var(--accent);
      padding: 12px 24px;
      border-radius: 12px;
      font-weight: 700;
      cursor: pointer;
      font-size: 1rem;
      transition: all 0.2s;
      font-family: 'Assistant', sans-serif;
    }

    .btn-admin:hover {
      background: var(--primary-dark);
      transform: translateY(-2px);
    }

    .btn-download {
      background: #15803d;
      border-color: #86efac;
    }

    .btn-download:hover {
      background: #166534;
    }
  </style>
</head>
<body>

  <!-- מסך כניסה מאובטח בסיסמה -->
  <div id="loginScreen" class="container">
    <div class="admin-login-box">
      <div style="font-size: 2.5rem; margin-bottom: 10px;">🔐</div>
      <h2 style="color: #fff; margin-bottom: 6px;">כניסה למערכת הניהול</h2>
      <p style="color: var(--text-muted); font-size: 0.85rem; margin-bottom: 20px;">נגיש למנהלת הפלטפורמה בלבד</p>
      
      <div class="form-group">
        <label>סיסמת גישה:</label>
        <input type="password" id="adminPasswordInput" class="form-control" placeholder="הקלידי סיסמה...">
      </div>
      <button class="btn-admin" style="width: 100%; margin-top: 10px;" onclick="checkAdminPassword()">כניסה לממשק ←</button>
    </div>
  </div>

  <!-- לוח הבקרה של המנהלת -->
  <div id="adminPanel" class="container admin-panel">
    
    <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 24px;">
      <div>
        <span class="badge">&gt; admin_dashboard.active</span>
        <h1 style="font-size: 2rem; margin: 0;">הוספת תוכן ושיעורים חדשים</h1>
      </div>
      <button class="btn-nav" onclick="logoutAdmin()">התנתקות ✕</button>
    </div>

    <!-- טופס הוספת שיעור -->
    <div class="admin-card">
      <h3>1. פרטי השיעור והמסלול</h3>
      
      <div class="grid-2">
        <div class="form-group">
          <label>לאיזה מסלול להוסיף את השיעור?</label>
          <select id="lessonTrackSelect" class="form-control"></select>
        </div>
        <div class="form-group">
          <label>קטגוריה טכנית (למשל networking, memory, blue_team):</label>
          <input type="text" id="lessonCategory" class="form-control" placeholder="למשל: linux_privesc">
        </div>
      </div>

      <div class="form-group">
        <label>כותרת השיעור:</label>
        <input type="text" id="lessonTitle" class="form-control" placeholder="למשל: סריקת פורטים והגנה מפני Nmap">
      </div>
    </div>

    <div class="admin-card">
      <h3>2. שלבי הווידאו (3 רמות)</h3>
      
      <div class="form-group">
        <label>טעימה (2 דק') - קישור MP4 ישיר (או GitHub Release):</label>
        <input type="text" id="videoTasteUrl" class="form-control" placeholder="https://...">
        <label style="margin-top: 6px;">תיאור קצר לסרטון הטעימה:</label>
        <input type="text" id="videoTasteDesc" class="form-control" placeholder="ב-2 דקות: מה זה Nmap ומתי משתמשים בו?">
      </div>

      <div class="form-group">
        <label>צלילה לעומק (10 דק') - קישור MP4 ישיר:</label>
        <input type="text" id="videoDeepUrl" class="form-control" placeholder="https://...">
        <label style="margin-top: 6px;">תיאור קצר לסרטון העומק:</label>
        <input type="text" id="videoDeepDesc" class="form-control" placeholder="10 דקות: איך עובד SYN Scan וניתוח חבילות.">
      </div>

      <div class="form-group">
        <label>הופכת למומחית (30 דק') - קישור MP4 ישיר:</label>
        <input type="text" id="videoExpertUrl" class="form-control" placeholder="https://...">
        <label style="margin-top: 6px;">תיאור קצר לסרטון המומחית:</label>
        <input type="text" id="videoExpertDesc" class="form-control" placeholder="30 דקות מאסטר-קלאס: תרחיש מעשי מהשטח.">
      </div>
    </div>

    <div class="admin-card">
      <h3>3. כרטיסיית מושג ומעבדה (Hands-on)</h3>
      
      <div class="grid-2">
        <div class="form-group">
          <label>מושג סייבר (מונח מקצועי):</label>
          <input type="text" id="cardTermInput" class="form-control" placeholder="למשל: SYN Flood">
        </div>
        <div class="form-group">
          <label>הסבר המושג / המשמעות הפרקטית:</label>
          <textarea id="cardDefInput" class="form-control" placeholder="הסבר קצר על המושג..."></textarea>
        </div>
      </div>

      <div class="form-group">
        <label>הוראות מעבדה:</label>
        <textarea id="labInstructionInput" class="form-control" placeholder="מה המשימה המעשית שהלומדת צריכה לבצע?"></textarea>
      </div>

      <div class="grid-2">
        <div class="form-group">
          <label>פקודת קוד / סניפט למעבדה:</label>
          <input type="text" id="labSnippetInput" class="form-control" placeholder="nmap -sS -p- 192.168.1.1">
        </div>
        <div class="form-group">
          <label>קישור למעבדה חיצונית (TryHackMe / PortSwigger וכו'):</label>
          <input type="text" id="labLinkInput" class="form-control" placeholder="https://...">
        </div>
      </div>
    </div>

    <div class="admin-card">
      <h3>4. שאלת ראיון ורעיון לפרויקט</h3>
      
      <div class="form-group">
        <label>שאלה נפוצה מראיונות עבודה:</label>
        <input type="text" id="interviewQInput" class="form-control" placeholder="מה ההבדל בין סריקת TCP Connect ל-SYN Scan?">
      </div>

      <div class="form-group">
        <label>תשובה מומלצת:</label>
        <textarea id="interviewAInput" class="form-control" placeholder="תשובה מדויקת ומקצועית..."></textarea>
      </div>

      <div class="form-group">
        <label>הצעה לפרויקט עבור הפורטפוליו ב-GitHub:</label>
        <textarea id="projectIdeaInput" class="form-control" placeholder="בניית Port Scanner פשוט בפייתון..."></textarea>
      </div>
    </div>

    <!-- כפתורי שמירה וייצוא -->
    <div style="display: flex; gap: 14px; justify-content: center; margin-top: 30px;">
      <button class="btn-admin" onclick="addNewLessonToData()">➕ הוסיפי את השיעור למאגר</button>
      <button class="btn-admin btn-download" onclick="downloadCoursesFile()">💾 הורידי קובץ courses.js מעודכן</button>
    </div>

  </div>

  <script src="data/courses.js?v=4"></script>
  <script>
    // סיסמת ברירת מחדל
    const ADMIN_PASS = "cyberjunior2026";

    function checkAdminPassword() {
      const input = document.getElementById('adminPasswordInput').value;
      if (input === ADMIN_PASS) {
        document.getElementById('loginScreen').style.display = 'none';
        document.getElementById('adminPanel').style.display = 'block';
        loadTracksDropdown();
      } else {
        alert("סיסמה שגויה! הגישה למנהלת הפלטפורמה בלבד.");
      }
    }

    function logoutAdmin() {
      document.getElementById('loginScreen').style.display = 'block';
      document.getElementById('adminPanel').style.display = 'none';
      document.getElementById('adminPasswordInput').value = '';
    }

    function loadTracksDropdown() {
      const select = document.getElementById('lessonTrackSelect');
      select.innerHTML = coursesData.tracks.map(t => `
        <option value="${t.id}">${t.title}</option>
      `).join('');
    }

    function addNewLessonToData() {
      const trackId = document.getElementById('lessonTrackSelect').value;
      const track = coursesData.tracks.find(t => t.id === trackId);
      if (!track) return;

      const newLesson = {
        id: "lesson-" + Date.now(),
        title: document.getElementById('lessonTitle').value || "שיעור חדש",
        category: document.getElementById('lessonCategory').value || "general",
        videos: {
          taste: {
            url: document.getElementById('videoTasteUrl').value,
            desc: document.getElementById('videoTasteDesc').value
          },
          deep: {
            url: document.getElementById('videoDeepUrl').value,
            desc: document.getElementById('videoDeepDesc').value
          },
          expert: {
            url: document.getElementById('videoExpertUrl').value,
            desc: document.getElementById('videoExpertDesc').value
          }
        },
        cards: [
          {
            term: document.getElementById('cardTermInput').value || "מושג",
            def: document.getElementById('cardDefInput').value || "הסבר"
          }
        ],
        lab: {
          instruction: document.getElementById('labInstructionInput').value,
          snippet: document.getElementById('labSnippetInput').value,
          link: document.getElementById('labLinkInput').value,
          credit: "תרגיל מומלץ למסלול"
        },
        interviewQuestions: [
          {
            q: document.getElementById('interviewQInput').value,
            a: document.getElementById('interviewAInput').value
          }
        ],
        projectIdea: document.getElementById('projectIdeaInput').value
      };

      track.lessons.push(newLesson);
      alert("השיעור נוסף בהצלחה למאגר הזמני! כעת לחצי על 'הורידי קובץ courses.js מעודכן' כדי לשמור את השינויים לאתר.");
    }

    // יצירת קובץ courses.js להורדה ישירה
    function downloadCoursesFile() {
      const fileContent = "const coursesData = " + JSON.stringify(coursesData, null, 2) + ";";
      const blob = new Blob([fileContent], { type: "text/javascript;charset=utf-8" });
      const link = document.createElement("a");
      link.href = URL.createObjectURL(blob);
      link.download = "courses.js";
      link.click();
    }
  </script>
</body>
</html>
